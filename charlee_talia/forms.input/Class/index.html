<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forms and Inputs</title>
    <link rel="stylesheet" href="style.css">
</head>
 <body>
    
        <h1>Forms and Inputs</h1>

        <form action="">
            <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="Your name here"/>
            <br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="example@mail.com"/>
            <br>

            <label for="comm">Comment:</label>
            <textarea name="comm" id="comm">Type your comment here</textarea>
            <br>
            <button type="button" onclick="submitForm(this.form)">Send Comment</button>

        </form>

        <script src="script.js"></script>
</body>
</html>
