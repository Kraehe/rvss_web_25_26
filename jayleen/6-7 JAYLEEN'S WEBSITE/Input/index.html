<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and Input </title>
</head>
<body>
    <h1>Forms and Input</h1>
<link rel="stylesheet" href="style.css">

<form action="">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="Your name here" />
    <br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="example@mail.com" />
    <br>

    <label for="com">Comment</label>
    <textarea name="comm" id="comm"> Type your comment here</textarea>
    <br>
    
    <button type="button" onclick="submitForm(this.form)"> Send Comment</button>

</form>

<script src="script.js"></script>
</body>
</html>
